plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vannfamilyventures.christfire.omega.grandscheme.beastie'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.vannfamilyventures.christfire.omega.grandscheme.beastie"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 106
        versionName "10.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/christfire-release.keystore")
            storePassword "ChristFire2026!"
            keyAlias "christfire_key"
            keyPassword "ChristFire2026!"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.0'
}
